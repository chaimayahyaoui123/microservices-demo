apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    app: gateway
data:
  SERVER_PORT: "8222"
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_GATEWAY_ROUTES_0_ID: students
  SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://student:8090
  SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/students/**
  SPRING_CLOUD_GATEWAY_ROUTES_1_ID: schools
  SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://school:8070
  SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/schools/**
