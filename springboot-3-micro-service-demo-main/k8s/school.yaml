apiVersion: v1
kind: Service
metadata:
  name: school
  labels:
    app: school
spec:
  type: ClusterIP
  selector:
    app: school
  ports:
    - name: http
      port: 8070
      targetPort: 8070
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: school
  labels:
    app: school
spec:
  replicas: 1
  selector:
    matchLabels:
      app: school
  template:
    metadata:
      labels:
        app: school
    spec:
      containers:
        - name: school
          image: chaimayahyaoui/microservice-demo-school:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8070
          envFrom:
            - configMapRef:
                name: school-config
            - secretRef:
                name: school-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 30
            periodSeconds: 15
